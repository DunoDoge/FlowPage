<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- FlowPage 图标 · 合成预览（背景层 + 前景层；不直接用于工程） -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF7"/>
      <stop offset=".6" stop-color="#F6F4EE"/>
      <stop offset="1" stop-color="#EBE7DC"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#121211" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#paper)"/>

  <path d="M172 240 L412 240 L412 784 L292 704 L172 784 Z"
        fill="#FDFCF8" stroke="#121211" stroke-width="48"
        stroke-linejoin="round" filter="url(#lift)"/>
  <circle cx="292" cy="348" r="26" stroke="#121211" stroke-width="22"/>
  <path d="M292 380 C292 452 264 486 264 546"
        stroke="#C13B2A" stroke-width="22" stroke-linecap="round"/>

  <g stroke="#121211" stroke-width="48" stroke-linecap="round">
    <path d="M492 336 S582 300 672 336 S762 372 852 336"/>
    <path d="M492 512 S582 476 672 512 S762 548 852 512" stroke-opacity=".9"/>
    <path d="M492 688 S582 652 672 688 S762 724 852 688" stroke-opacity=".8"/>
  </g>
</svg>
